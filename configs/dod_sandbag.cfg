// DoD Sandbags 2.5.0 - GoldSrc Day of Defeat 1.3 / AMXX 1.9.0+
// Install as addons/amxmodx/configs/plugins/dod_sandbag.cfg.
// AutoExecConfig loads it once per map; an absent file is generated automatically.
// Edit this file, then change map/restart (or exec it from server console).
// Updates must preserve the owner's file. Lower limits do not delete existing bags.

// Master switch: 0 or 1. Disabling cancels previews; existing bags remain.
dod_sandbag_enabled "1"
// Total bags on a map: 1..128 (hard safety cap). Default: 64.
dod_sandbag_max_bags "64"
// Concurrent bags owned by a connected player: 0..128. 0 = no personal quota.
dod_sandbag_max_per_player "16"
// Minimum seconds between successful placements: 0.1..10.
dod_sandbag_cooldown "0.5"
// Placement distance in game units: 64..512.
dod_sandbag_reach "256"
// Health for NEW bags: 1..10000. Existing health is unchanged.
dod_sandbag_health "400"
// Damage per Colt/Luger/Webley hit: 0..1000. 0 = unmodified game damage.
// With 400 health and 40 damage, a fresh bag takes ten pistol hits.
dod_sandbag_pistol_damage "40"
// Seconds until NEW bags expire: 0..3600. 0 = no expiry before map change.
dod_sandbag_lifetime "0"
// Remove a player's bags on disconnect: 0 or 1. Stops simple reconnect quota abuse.
dod_sandbag_remove_on_disconnect "1"
// Required AMXX admin flags (ALL listed flags). Empty = everyone; "h" = ADMIN_CFG.
// Use lowercase a-z only. Invalid input denies building until corrected.
dod_sandbag_access_flags ""
// Free engine entities reserved for the map and other plugins: 32..256.
// A global bag quota alone is not an engine entity-capacity guarantee.
dod_sandbag_entity_reserve "64"
// Preview opacity: 20..200. Preview updates are capped at 20 Hz.
dod_sandbag_preview_alpha "125"
